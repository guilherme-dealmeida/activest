# Perfil dos containers (docker compose): banco e Redis da rede interna, dados em /app/data.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:db_primevest}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

primevest:
  logos:
    dir: /app/data/logos
  data:
    dir: /app/data

logging:
  level:
    com.primevest: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
