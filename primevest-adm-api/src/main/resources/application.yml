# primevest-adm-api — rotinas de administrador: o catalogo (docs/planos/PLANO_ADM_API.md, secao 10).
# Mesmo banco, mesmo Redis e mesmo JWT da app-api. Grava so catalogo; a carteira de cada
# usuario e a app-api quem recalcula, avisada pelo Redis ("catalogo mudou").
spring:
  application:
    name: primevest-adm-api

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # As migrations estao no primevest-core. As duas aplicacoes rodam o Flyway ao subir; ele trava
  # o banco enquanto migra (a primeira aplica, a outra encontra tudo aplicado) — secao 4.4.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Redis: so as mensagens com a app-api (sem cache aqui).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: none

# JWT: o token vem do login da app-api; aqui so se valida (mesmo segredo).
jwt:
  secret: ${JWT_SECRET:primevest-default-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000
  refresh-expiration: 604800000

server:
  port: 8081
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# BrAPI Integration (docs/planos/PLANO_BRAPI.md)
#
# Plano gratuito: 15.000 requisicoes/mes, 1 ativo por chamada, 1 chamada por
# vez. Endpoints v2, token no cabecalho Authorization: Bearer — nunca na URL.
# O token vem do .env da raiz (fora do git).
brapi:
  base-url: https://brapi.dev/api
  token: ${BRAPI_TOKEN:}
  timeout-seconds: 20

# CoinGecko Integration (cripto; o id de cada moeda esta em assets.price_source_ref)
coingecko:
  base-url: https://api.coingecko.com/api/v3
  timeout-seconds: 20

# Site da B3 (proventos e eventos societarios), FNET e cadastro da CVM — sem token.
b3:
  base-url: https://sistemaswebb3-listados.b3.com.br
  timeout-seconds: 40
fnet:
  base-url: https://fnet.bmfbovespa.com.br/fnet/publico
  # Cada aviso responde em ~0,1 s ou trava: timeout curto e ate 6 tentativas com espera
  # crescente (0,5 s, 1 s, 2 s...), no maximo 3 downloads ao mesmo tempo. Avisos ficam em
  # ${primevest.data.dir}/fnet/{id}.xml e nunca sao baixados de novo (F8).
  timeout-seconds: 5
  attempts: 6
  retry-base-millis: 500
  parallel-downloads: 3
  # A busca por CNPJ e mais lenta (3 a 10 s; as vezes trava ou responde 520).
  search-timeout-seconds: 20
  search-attempts: 3
cvm:
  # Dados abertos (docs/planos/PLANO_EMPRESAS_BALANCOS.md): cadastro, FCA, DFP, ITR e informe
  # de FII, com cache em disco em ${primevest.data.dir}/cvm.
  base-url: https://dados.cvm.gov.br/dados
  timeout-seconds: 120

# Indices de mercado (docs/planos/PLANO_INDICES_MERCADO.md): API SGS do Banco Central (CDI, Selic, IPCA,
# IGP-M, INPC, TR, meta Selic, PTAX) e o site da B3 (Ibovespa, IFIX, em b3.base-url). Uma consulta por ano;
# o SGS as vezes demora: timeout de 20 s e ate 4 tentativas com espera crescente (1 s, 2 s, 4 s).
# Cache por ano em ${primevest.data.dir}/bcb/sgs e ${primevest.data.dir}/b3/indices.
bcb:
  sgs-base-url: https://api.bcb.gov.br/dados/serie
indices:
  timeout-seconds: 20
  attempts: 4
  retry-base-millis: 1000

# Rotinas (fuso America/Sao_Paulo). Cron do Spring: segundo minuto hora dia mes dia-da-semana.
primevest:
  # Cache das fontes publicas (CVM, B3, FNET) e logos. No Docker: /app/data,
  # volume ./data da raiz do projeto (docs/planos/PLANO_EMPRESAS_BALANCOS.md, secao 2).
  data:
    dir: ${DATA_DIR:../carga/data}
  issuers:
    # Pausa entre chamadas ao GetDetail da B3 (classificacao setorial).
    pause-millis: 1000
  closing:
    # Fechamento: B3 em dia util e cripto todo dia, as 19:00 (secao 3 do plano).
    b3-cron: "0 0 19 * * MON-FRI"
    crypto-cron: "0 0 19 * * *"
  proventos:
    enabled: true
    cron: "0 0 20 * * *"
    # ALL: todo ativo ligado a um emissor + o que ja esteve em carteira (F8);
    # HELD: so o que ja esteve em carteira (como antes da F8).
    scope: ALL
    # Pausa entre chamadas a B3/FNET: o site e publico e nao documentado.
    pause-millis: 1000
  cvm-statements:
    # Balancos (DFP/ITR) do ano corrente e do anterior; a CVM atualiza de madrugada.
    enabled: true
    cron: "0 30 7 * * *"
  indices:
    # Incremental todo dia as 10:00 (D5), com recuperacao na subida.
    enabled: true
    cron: "0 0 10 * * *"
  catalog-audit:
    cron: "0 0 7 * * MON"
    # Ficaram de fora do catalogo de proposito (secao 2.2 e planilha de ETFs,
    # aba "Excluidos"): nao sao anunciados como "novos" toda semana.
    ignored: >-
      BRAX,ESUD11,ABCB10L,
      BBSD,BOVA,BOVV,DIVO,ECOO,FIND,GOVE,ISUS,SCVB,XBOV,BDIF11,BIDB11,BINC11,BODB11,BODI11,CDII11,
      CPDI11,CPTI11,DIVS11,IFRA11,IFRI11,ISEN11,ISET11,ISNN11,ISNT11,ISTT11,KNDI11,PREE11,RBIF11,
      SNID11,XPID11,BTAL11,BTRA11,FNAM11,FNOR11,FSPE11,FSRF11,PSVM11
  logos:
    # Pasta fora do banco (B18). No Docker e o volume ./data/logos.
    dir: ${LOGOS_DIR:../carga/data/logos}
    cron: "0 0 6 1 * *"

logging:
  level:
    com.primevest: INFO
    # PDFBox avisa a troca de fonte em cada relatorio de proventos da CVM (so leitura de texto)
    org.apache.pdfbox: ERROR
    org.springframework.security: INFO
