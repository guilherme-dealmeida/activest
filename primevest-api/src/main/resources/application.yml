spring:
  application:
    name: primevest-api

  profiles:
    active: dev

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 18

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Security - Google OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

  # Redis Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:primevest-default-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000       # 24 hours
  refresh-expiration: 604800000  # 7 days

# Server
server:
  port: 8080
  servlet:
    context-path: /

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# BrAPI Integration
brapi:
  base-url: https://brapi.dev/api
  token: ${BRAPI_TOKEN:}

# CoinGecko Integration
coingecko:
  base-url: https://api.coingecko.com/api/v3

# Logging
logging:
  level:
    com.primevest: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
