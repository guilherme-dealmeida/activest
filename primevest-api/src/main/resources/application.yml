spring:
  application:
    name: primevest-api

  profiles:
    active: dev

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  #
  # 'baseline-version: 18' foi removido daqui. Ele fazia o Flyway marcar um banco
  # vazio como se já estivesse na versão 18, pulando a criação das tabelas (V1-V11)
  # e todos os seeds (V12-V18) — só a V19 rodava. Na prática o projeto não subia do
  # zero, dependia de um banco criado à mão antes disso.
  # Cada perfil decide se o Flyway roda: dev deixa desligado (banco local já pronto),
  # docker liga (banco nasce vazio e é construído pela cadeia completa).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Redis Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000

# Login pelo Google
#
# Só o client id, e ele não é segredo: vai no bundle do front, visível a quem
# abrir o DevTools. O que protege a aplicação é o Google só emitir ID token com
# esta audience para as origens autorizadas no console, e o backend conferir
# assinatura e audience (ver GoogleTokenVerifier).
#
# Client SECRET não aparece em lugar nenhum: o fluxo de ID token não usa.
# Vazio ou 'dummy' desliga o login pelo Google e some com o botão na tela.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:primevest-default-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000       # 24 hours
  refresh-expiration: 604800000  # 7 days

# Server
server:
  port: 8080
  servlet:
    context-path: /

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# BrAPI Integration (PLANO_BRAPI.md)
#
# Plano gratuito: 15.000 requisicoes/mes, 1 ativo por chamada, 1 chamada por
# vez. Endpoints v2, token no cabecalho Authorization: Bearer — nunca na URL.
# O token vem do .env da raiz (fora do git).
brapi:
  base-url: https://brapi.dev/api
  token: ${BRAPI_TOKEN:}
  timeout-seconds: 20

# CoinGecko Integration (cripto; o id de cada moeda esta em assets.price_source_ref)
coingecko:
  base-url: https://api.coingecko.com/api/v3
  timeout-seconds: 20

# Binance (PLANO_CRIPTO_BINANCE.md, F3). So leitura, com a chave de cada
# usuario (integration_credentials) — nenhuma credencial aqui.
binance:
  base-url: https://api.binance.com
  timeout-seconds: 30
  # Primeira busca: desde quando. O Convert tem janelas de 30 dias e peso alto
  # (uma janela por ~1 s), por isso comeca mais tarde.
  history-start: "2017-07-01"
  convert-history-start: "2020-01-01"
  convert-pause-millis: 1100
  # Pares consultados no myTrades: moedas candidatas x moedas de cotacao.
  quote-assets: BRL,USDT,USDC,FDUSD,BTC,ETH,BNB
  probe-assets: BTC,ETH,BNB,SOL,XRP,USDT,USDC,ADA,DOGE
  # Peso por IP no minuto (limite da Binance: 6000). Passando daqui, a proxima
  # chamada espera o minuto virar — o orcamento e compartilhado por todos os usuarios.
  weight-threshold: 4800

# Site da B3 (proventos e eventos societarios), FNET e cadastro da CVM — sem token.
b3:
  base-url: https://sistemaswebb3-listados.b3.com.br
  timeout-seconds: 40
fnet:
  base-url: https://fnet.bmfbovespa.com.br/fnet/publico
  # Alguns avisos travam no FNET: melhor desistir cedo e tentar de novo depois.
  timeout-seconds: 15
cvm:
  fii-registry-url: https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/DADOS/inf_mensal_fii_%d.zip

# Rotinas (fuso America/Sao_Paulo). Cron do Spring: segundo minuto hora dia mes dia-da-semana.
primevest:
  closing:
    # Fechamento: B3 em dia util e cripto todo dia, as 19:00 (secao 3 do plano).
    b3-cron: "0 0 19 * * MON-FRI"
    crypto-cron: "0 0 19 * * *"
  proventos:
    enabled: true
    cron: "0 0 20 * * *"
    # Pausa entre chamadas a B3/FNET: o site e publico e nao documentado.
    pause-millis: 1000
  catalog-audit:
    cron: "0 0 7 * * MON"
    # Ficaram de fora do catalogo de proposito (secao 2.2 e planilha de ETFs,
    # aba "Excluidos"): nao sao anunciados como "novos" toda semana.
    ignored: >-
      BRAX,ESUD11,ABCB10L,
      BBSD,BOVA,BOVV,DIVO,ECOO,FIND,GOVE,ISUS,SCVB,XBOV,BDIF11,BIDB11,BINC11,BODB11,BODI11,CDII11,
      CPDI11,CPTI11,DIVS11,IFRA11,IFRI11,ISEN11,ISET11,ISNN11,ISNT11,ISTT11,KNDI11,PREE11,RBIF11,
      SNID11,XPID11,BTAL11,BTRA11,FNAM11,FNOR11,FSPE11,FSRF11,PSVM11
  # Integracoes com corretoras (PLANO_CRIPTO_BINANCE.md, 6.3). A credencial de
  # cada usuario e cifrada com AES-256-GCM por esta chave-mestra, que fica fora
  # do banco (vem do .env). Vazia: a API sobe, mas conexoes ficam indisponiveis.
  # Rotacao: gere uma chave nova, mova a atual para previous-keys ("1:<base64>")
  # e incremente key-version. Ver CredentialCipher.
  integrations:
    credentials:
      key: ${PRIMEVEST_CREDENTIALS_KEY:}
      key-version: ${PRIMEVEST_CREDENTIALS_KEY_VERSION:1}
      previous-keys: ${PRIMEVEST_CREDENTIALS_PREVIOUS_KEYS:}
    # Sincronizacao em segundo plano (F5). O worker pega uma execucao da fila a
    # cada worker-delay-ms; a rotina diaria enfileira todas as conexoes ativas.
    worker-delay-ms: 5000
    sync-cron: "0 30 6 * * *"
    # Execucao RUNNING ha mais tempo que isto e tida como perdida (API caiu no meio).
    stale-minutes: 30
    # Rotina diaria confirma sozinha quando nao ha nada a decidir (nenhuma
    # possivel duplicata) e a conexao ja teve uma importacao confirmada pelo usuario.
    auto-confirm-scheduled: true
  logos:
    # Pasta fora do banco (B18). No Docker e o volume ./data/logos.
    dir: ${LOGOS_DIR:../data/logos}
    cron: "0 0 6 1 * *"

# Logging
logging:
  level:
    com.primevest: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
