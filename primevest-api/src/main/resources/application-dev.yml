spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_primevest
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

  # Dev: disable Redis if not available
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: simple

  # Disable OAuth2 in dev
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

logging:
  level:
    com.primevest: DEBUG
    org.springframework.security: DEBUG
