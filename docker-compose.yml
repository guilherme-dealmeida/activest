# Activest - ambiente de desenvolvimento completo
#
#   docker compose up --build       sobe tudo
#   docker compose down             para tudo (mantém o banco)
#   docker compose down -v          para tudo e APAGA o banco (recria do zero na próxima subida)
#
# Copie .env.example para .env se quiser sobrescrever qualquer valor.
#
# Carga e bucket (profile "carga", não sobe no `up`):
#   docker compose --profile carga run --rm data pull [--minimo]   bucket R2 -> carga/data/ (máquina nova)
#   docker compose --profile carga run --rm data push              carga/data/ -> bucket + manifests (produtor)
#   docker compose --profile carga run --rm data status            carga/data/ x bucket
#   docker compose --profile carga run --rm tools node carga/scripts/admin.mjs bootstrap
#
# Simulador da API da Área do Investidor da B3 (profile "b3mock"; docs/planos/PLANO_INTEGRACAO_B3.md, 6.10):
#   docker compose --profile b3mock up -d b3-investidor-mock

# Nome fixo do projeto: o volume do banco (activest_pgdata) nao depende do nome da pasta.
name: activest

services:
  db:
    image: postgres:17-alpine
    container_name: activest-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_activest}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 5433 no host para não colidir com o PostgreSQL instalado na máquina (que usa 5432).
      # Para conectar pelo pgAdmin: localhost:5433
      - "0.0.0.0:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-db_activest}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: activest-redis
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # API do usuario — a carteira (docs/planos/PLANO_ADM_API.md). Build da raiz: o Maven e
  # multi-modulo (pom.xml da raiz, activest-core, activest-adm-api, activest-app-api).
  app-api:
    build:
      context: .
      target: dev
      args:
        MODULE: activest-app-api
    container_name: activest-app-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_activest}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-activest-default-secret-key-change-in-production-minimum-256-bits-long}
      # Mesmo valor que o web recebe em VITE_GOOGLE_CLIENT_ID. Os dois lados
      # PRECISAM bater: o navegador pede o ID token para esta audience e a API
      # só aceita token emitido para ela. Vazio desliga o login pelo Google.
      # Não existe client secret aqui — o fluxo de ID token não usa.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Chave-mestra das credenciais de integracao (corretoras). Vem do .env,
      # nunca do repositorio. Vazia: conexoes com corretoras ficam indisponiveis.
      ACTIVEST_CREDENTIALS_KEY: ${ACTIVEST_CREDENTIALS_KEY:-}
      ACTIVEST_CREDENTIALS_KEY_VERSION: ${ACTIVEST_CREDENTIALS_KEY_VERSION:-1}
      ACTIVEST_CREDENTIALS_PREVIOUS_KEYS: ${ACTIVEST_CREDENTIALS_PREVIOUS_KEYS:-}
      # Área do Investidor da B3 (docs/planos/PLANO_INTEGRACAO_B3.md, 6.13). Sem contrato com a B3,
      # aponta para o simulador (b3-investidor-mock). B3I_ENABLED vazio/false: a B3 fica desligada.
      B3I_ENABLED: ${B3I_ENABLED:-false}
      B3I_BASE_URL: ${B3I_BASE_URL:-}
      B3I_TOKEN_URL: ${B3I_TOKEN_URL:-}
      B3I_CLIENT_ID: ${B3I_CLIENT_ID:-}
      B3I_CLIENT_SECRET: ${B3I_CLIENT_SECRET:-}
      B3I_SCOPE: ${B3I_SCOPE:-}
      B3I_CERT_P12_PATH: ${B3I_CERT_P12_PATH:-}
      B3I_CERT_P12_PASSWORD: ${B3I_CERT_P12_PASSWORD:-}
      B3I_OPTIN_URL: ${B3I_OPTIN_URL:-}
      B3I_ONCE_PER_DAY: ${B3I_ONCE_PER_DAY:-true}
      # Cadastro de usuario (docs/planos/PLANO_CADASTRO_USUARIO.md). SIGNUP_ENABLED=false: ninguem cria
      # conta (nem pelo Google). ACTIVEST_HASH_KEY: HMAC dos codigos e do CPF (vazio cai no JWT_SECRET).
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      ACTIVEST_HASH_KEY: ${ACTIVEST_HASH_KEY:-}
      # E-mail: por padrao o Mailpit abaixo (nada sai da maquina). SMTP real: preencha no .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Activest <contato@activest.com.br>}
      APP_URL: ${APP_URL:-http://localhost:5173}
    ports:
      - "0.0.0.0:${API_PORT:-8080}:8080"
    volumes:
      # Hot reload: o código-fonte vem da máquina, o Spring DevTools reinicia sozinho.
      # So poms e src entram; os target/ ficam dentro do container.
      - ./pom.xml:/app/pom.xml
      - ./activest-core/pom.xml:/app/activest-core/pom.xml
      - ./activest-core/src:/app/activest-core/src
      # integracoes com corretoras (docs/planos/PLANO_INTEGRACAO_B3.md, F1): a app-api depende delas
      - ./activest-integration/pom.xml:/app/activest-integration/pom.xml
      - ./activest-integration/src:/app/activest-integration/src
      # o reator exige o pom de todos os modulos, e a app-api usa a adm-api nos testes
      - ./activest-adm-api/pom.xml:/app/activest-adm-api/pom.xml
      - ./activest-adm-api/src:/app/activest-adm-api/src
      - ./activest-app-api/pom.xml:/app/activest-app-api/pom.xml
      - ./activest-app-api/src:/app/activest-app-api/src
      # Cache do Maven entre subidas — sem isso cada build rebaixa todas as dependências.
      - maven-repo:/root/.m2
      # Logos baixados pela adm-api: aqui so leitura, para a tela.
      - ./carga/data/logos:/app/data/logos:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Caixa de e-mail do DEV (docs/planos/PLANO_CADASTRO_USUARIO.md, D7): recebe todo e-mail que a app-api
  # envia (codigos de cadastro, senha, troca de e-mail) e mostra em http://localhost:8025. Nao envia nada
  # para fora. Tem API (http://localhost:8025/api/v1/messages), que os testes E2E podem usar para ler o codigo.
  mailpit:
    image: axllent/mailpit:latest
    container_name: activest-mailpit
    ports:
      - "0.0.0.0:${MAILPIT_PORT:-8025}:8025"
      - "0.0.0.0:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  # Rotinas de administrador — o catalogo (docs/planos/PLANO_ADM_API.md, secao 10): emissores, balancos,
  # COTAHIST, fechamento, proventos da B3/FNET, logos e /api/v1/admin/*. Mesmo banco, Redis e
  # JWT da app-api; grava so catalogo e avisa a carteira pelo Redis. O front nao chama esta API.
  adm-api:
    build:
      context: .
      target: dev
      args:
        MODULE: activest-adm-api
    container_name: activest-adm-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_activest}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-activest-default-secret-key-change-in-production-minimum-256-bits-long}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
    ports:
      - "0.0.0.0:${ADM_API_PORT:-8081}:8081"
    volumes:
      - ./pom.xml:/app/pom.xml
      - ./activest-core/pom.xml:/app/activest-core/pom.xml
      - ./activest-core/src:/app/activest-core/src
      - ./activest-adm-api/pom.xml:/app/activest-adm-api/pom.xml
      - ./activest-adm-api/src:/app/activest-adm-api/src
      # o reator exige o pom de todos os modulos
      - ./activest-integration/pom.xml:/app/activest-integration/pom.xml
      - ./activest-app-api/pom.xml:/app/activest-app-api/pom.xml
      - maven-repo:/root/.m2
      # Arquivos baixados pelas rotinas (ignorados pelo git): logos (docs/planos/PLANO_BRAPI.md,
      # F7) e o cache das fontes publicas — CVM, B3, FNET (docs/planos/PLANO_EMPRESAS_BALANCOS.md,
      # secao 2). O arquivo em disco e o estado: apagar so obriga a baixar de novo.
      - ./carga/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./activest-web
      target: dev
    container_name: activest-web
    environment:
      # O proxy do Vite precisa apontar para o container da API, não para localhost.
      VITE_API_TARGET: http://app-api:8080
      # Tela de Tarefas: /api/v1/tasks vai para a adm-api (docs/planos/PLANO_TAREFAS.md, D9)
      VITE_ADM_API_TARGET: http://adm-api:8081
      # Bind mount no Windows não propaga eventos de arquivo: polling é necessário para o hot reload.
      CHOKIDAR_USEPOLLING: "true"
      # Mesma variável do .env que vai para a app-api, para não haver dois valores
      # para a mesma coisa. O Vite embute isso no bundle: é público por natureza.
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # O prefixo 0.0.0.0: existe para publicar SOMENTE em IPv4. Sem ele o Docker
      # publica nas duas pilhas e o navegador tenta ::1 primeiro; como o Vite
      # escuta só numa delas, localhost:5173 fica pendurado (127.0.0.1 funciona).
      # O mesmo vale para as demais portas deste arquivo.
      - "0.0.0.0:${WEB_PORT:-5173}:5173"
    volumes:
      - ./activest-web:/app
      # Volume anônimo: preserva o node_modules instalado na imagem Linux,
      # evitando que o node_modules do Windows sobrescreva binários nativos.
      - /app/node_modules
    depends_on:
      - app-api
      # /api/v1/tasks (tela de Tarefas) vai para a adm-api; o nginx do runtime resolve o nome na subida
      - adm-api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile "carga" (docs/planos/PLANO_CARGA_INICIAL.md): não sobem no `docker compose up`.
  # ---------------------------------------------------------------------------

  # Simulador da API da Área do Investidor da B3 (docs/planos/PLANO_INTEGRACAO_B3.md, 6.10): só sobe com
  # --profile b3mock. Responde nas rotas e no formato da B3 com os extratos exportados da Área do Investidor,
  # lidos de B3I_MOCK_DATA_DIR (padrão carga/mocks, fora do git); sem planilha, usa os dados sintéticos
  # versionados. Token com as mesmas credenciais B3I_* da app-api; CPF fictício em B3I_MOCK_DOCUMENT.
  b3-investidor-mock:
    build: ./carga/scripts/b3investidor/simulador
    profiles: ["b3mock"]
    container_name: activest-b3-investidor-mock
    environment:
      B3I_MOCK_CLIENT_ID: ${B3I_CLIENT_ID:-activest-teste}
      B3I_MOCK_CLIENT_SECRET: ${B3I_CLIENT_SECRET:-segredo-teste}
      B3I_MOCK_SCOPE: ${B3I_SCOPE:-b3i-simulador/.default}
      B3I_MOCK_DOCUMENT: ${B3I_MOCK_DOCUMENT:-52998224725}
      B3I_MOCK_AUTHORIZED: ${B3I_MOCK_AUTHORIZED:-false}
      # links da paginação e página de autorização, como o navegador as vê
      B3I_MOCK_PUBLIC_URL: http://localhost:${B3I_MOCK_PORT:-8090}
    ports:
      - "127.0.0.1:${B3I_MOCK_PORT:-8090}:8090"
    volumes:
      - ./carga/scripts/b3investidor:/app:ro
      - ${B3I_MOCK_DATA_DIR:-./carga/mocks}:/data:ro

  # carga/data/ <-> bucket R2 (rclone). A aplicação lê só a carga/data/ local; o bucket é a cópia de
  # referência: a máquina nova baixa uma vez (pull, token só leitura) e o produtor sobe o
  # que as rotinas gravaram (push, chave de escrita). O push nunca apaga nada no bucket.
  data:
    image: rclone/rclone:1.75.1
    profiles: ["carga"]
    entrypoint: ["sh", "/scripts/data.sh"]
    command: ["status"]
    environment:
      DATA_STORAGE: ${DATA_STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-activest-data}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      # token só leitura não pode (nem precisa) conferir/criar o bucket
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./carga/data:/data
      - ./carga/scripts/data:/scripts:ro

  # Scripts Node do projeto (carga/scripts/*.mjs) sem Node na máquina: falam com as APIs pela
  # rede do compose.
  tools:
    image: node:22-alpine
    profiles: ["carga"]
    working_dir: /work
    environment:
      ACTIVEST_API_URL: http://app-api:8080
      ACTIVEST_ADM_URL: http://adm-api:8081
      ACTIVEST_PASSWORD: ${ACTIVEST_PASSWORD:-}
    volumes:
      - ./carga/scripts:/work/carga/scripts:ro

volumes:
  pgdata:
  maven-repo:
