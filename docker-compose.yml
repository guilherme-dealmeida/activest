# PrimeVest - ambiente de desenvolvimento completo
#
#   docker compose up --build       sobe tudo
#   docker compose down             para tudo (mantém o banco)
#   docker compose down -v          para tudo e APAGA o banco (recria do zero na próxima subida)
#
# Copie .env.example para .env se quiser sobrescrever qualquer valor.
#
# Carga e bucket (profile "carga", não sobe no `up`):
#   docker compose --profile carga run --rm data pull [--minimo]   bucket R2 -> carga/data/ (máquina nova)
#   docker compose --profile carga run --rm data push              carga/data/ -> bucket + manifests (produtor)
#   docker compose --profile carga run --rm data status            carga/data/ x bucket
#   docker compose --profile carga run --rm tools node carga/scripts/admin.mjs bootstrap

services:
  db:
    image: postgres:17-alpine
    container_name: primevest-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_primevest}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 5433 no host para não colidir com o PostgreSQL instalado na máquina (que usa 5432).
      # Para conectar pelo pgAdmin: localhost:5433
      - "0.0.0.0:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-db_primevest}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: primevest-redis
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # API do usuario — a carteira (docs/planos/PLANO_ADM_API.md). Build da raiz: o Maven e
  # multi-modulo (pom.xml da raiz, primevest-core, primevest-adm-api, primevest-app-api).
  app-api:
    build:
      context: .
      target: dev
      args:
        MODULE: primevest-app-api
    container_name: primevest-app-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_primevest}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-primevest-default-secret-key-change-in-production-minimum-256-bits-long}
      # Mesmo valor que o web recebe em VITE_GOOGLE_CLIENT_ID. Os dois lados
      # PRECISAM bater: o navegador pede o ID token para esta audience e a API
      # só aceita token emitido para ela. Vazio desliga o login pelo Google.
      # Não existe client secret aqui — o fluxo de ID token não usa.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Chave-mestra das credenciais de integracao (corretoras). Vem do .env,
      # nunca do repositorio. Vazia: conexoes com corretoras ficam indisponiveis.
      PRIMEVEST_CREDENTIALS_KEY: ${PRIMEVEST_CREDENTIALS_KEY:-}
      PRIMEVEST_CREDENTIALS_KEY_VERSION: ${PRIMEVEST_CREDENTIALS_KEY_VERSION:-1}
      PRIMEVEST_CREDENTIALS_PREVIOUS_KEYS: ${PRIMEVEST_CREDENTIALS_PREVIOUS_KEYS:-}
    ports:
      - "0.0.0.0:${API_PORT:-8080}:8080"
    volumes:
      # Hot reload: o código-fonte vem da máquina, o Spring DevTools reinicia sozinho.
      # So poms e src entram; os target/ ficam dentro do container.
      - ./pom.xml:/app/pom.xml
      - ./primevest-core/pom.xml:/app/primevest-core/pom.xml
      - ./primevest-core/src:/app/primevest-core/src
      # o reator exige o pom de todos os modulos, e a app-api usa a adm-api nos testes
      - ./primevest-adm-api/pom.xml:/app/primevest-adm-api/pom.xml
      - ./primevest-adm-api/src:/app/primevest-adm-api/src
      - ./primevest-app-api/pom.xml:/app/primevest-app-api/pom.xml
      - ./primevest-app-api/src:/app/primevest-app-api/src
      # Cache do Maven entre subidas — sem isso cada build rebaixa todas as dependências.
      - maven-repo:/root/.m2
      # Logos baixados pela adm-api: aqui so leitura, para a tela.
      - ./carga/data/logos:/app/data/logos:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Rotinas de administrador — o catalogo (docs/planos/PLANO_ADM_API.md, secao 10): emissores, balancos,
  # COTAHIST, fechamento, proventos da B3/FNET, logos e /api/v1/admin/*. Mesmo banco, Redis e
  # JWT da app-api; grava so catalogo e avisa a carteira pelo Redis. O front nao chama esta API.
  adm-api:
    build:
      context: .
      target: dev
      args:
        MODULE: primevest-adm-api
    container_name: primevest-adm-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_primevest}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-primevest-default-secret-key-change-in-production-minimum-256-bits-long}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
    ports:
      - "0.0.0.0:${ADM_API_PORT:-8081}:8081"
    volumes:
      - ./pom.xml:/app/pom.xml
      - ./primevest-core/pom.xml:/app/primevest-core/pom.xml
      - ./primevest-core/src:/app/primevest-core/src
      - ./primevest-adm-api/pom.xml:/app/primevest-adm-api/pom.xml
      - ./primevest-adm-api/src:/app/primevest-adm-api/src
      - ./primevest-app-api/pom.xml:/app/primevest-app-api/pom.xml
      - maven-repo:/root/.m2
      # Arquivos baixados pelas rotinas (ignorados pelo git): logos (docs/planos/PLANO_BRAPI.md,
      # F7) e o cache das fontes publicas — CVM, B3, FNET (docs/planos/PLANO_EMPRESAS_BALANCOS.md,
      # secao 2). O arquivo em disco e o estado: apagar so obriga a baixar de novo.
      - ./carga/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./primevest-web
      target: dev
    container_name: primevest-web
    environment:
      # O proxy do Vite precisa apontar para o container da API, não para localhost.
      VITE_API_TARGET: http://app-api:8080
      # Bind mount no Windows não propaga eventos de arquivo: polling é necessário para o hot reload.
      CHOKIDAR_USEPOLLING: "true"
      # Mesma variável do .env que vai para a app-api, para não haver dois valores
      # para a mesma coisa. O Vite embute isso no bundle: é público por natureza.
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # O prefixo 0.0.0.0: existe para publicar SOMENTE em IPv4. Sem ele o Docker
      # publica nas duas pilhas e o navegador tenta ::1 primeiro; como o Vite
      # escuta só numa delas, localhost:5173 fica pendurado (127.0.0.1 funciona).
      # O mesmo vale para as demais portas deste arquivo.
      - "0.0.0.0:${WEB_PORT:-5173}:5173"
    volumes:
      - ./primevest-web:/app
      # Volume anônimo: preserva o node_modules instalado na imagem Linux,
      # evitando que o node_modules do Windows sobrescreva binários nativos.
      - /app/node_modules
    depends_on:
      - app-api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile "carga" (docs/planos/PLANO_CARGA_INICIAL.md): não sobem no `docker compose up`.
  # ---------------------------------------------------------------------------

  # carga/data/ <-> bucket R2 (rclone). A aplicação lê só a carga/data/ local; o bucket é a cópia de
  # referência: a máquina nova baixa uma vez (pull, token só leitura) e o produtor sobe o
  # que as rotinas gravaram (push, chave de escrita). O push nunca apaga nada no bucket.
  data:
    image: rclone/rclone:1.75.1
    profiles: ["carga"]
    entrypoint: ["sh", "/scripts/data.sh"]
    command: ["status"]
    environment:
      DATA_STORAGE: ${DATA_STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-primevest-data}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      # token só leitura não pode (nem precisa) conferir/criar o bucket
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./carga/data:/data
      - ./carga/scripts/data:/scripts:ro

  # Scripts Node do projeto (carga/scripts/*.mjs) sem Node na máquina: falam com as APIs pela
  # rede do compose.
  tools:
    image: node:22-alpine
    profiles: ["carga"]
    working_dir: /work
    environment:
      PRIMEVEST_API_URL: http://app-api:8080
      PRIMEVEST_ADM_URL: http://adm-api:8081
      PRIMEVEST_SENHA: ${PRIMEVEST_SENHA:-}
    volumes:
      - ./carga/scripts:/work/carga/scripts:ro

volumes:
  pgdata:
  maven-repo:
