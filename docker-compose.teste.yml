# Pilha primevest-teste (docs/planos/PLANO_PRIMEVEST_TESTE.md): os mesmos servicos do docker-compose.yml,
# com nome de conteiner, pasta de dados e rotinas proprios. As portas vem do .env.teste.
# Sempre junto do arquivo base, com projeto e variaveis do teste (sem eles o comando atinge a pilha do dev):
#
#   docker compose -p primevest-teste --env-file .env.teste -f docker-compose.yml -f docker-compose.teste.yml up -d --build
#
# Atalho da sessao do PowerShell (na raiz):
#   function pvt { docker compose -p primevest-teste --env-file .env.teste -f docker-compose.yml -f docker-compose.teste.yml @args }
#
# Volume com o mesmo destino no conteiner substitui o do arquivo base: /app/data, /app/data/logos e /data
# apontam para carga/data-teste (a carga/data do dev nao e tocada).

services:
  db:
    container_name: primevest-teste-db

  redis:
    container_name: primevest-teste-redis

  app-api:
    container_name: primevest-teste-app-api
    environment:
      # Rotinas agendadas desligadas (D3): nada roda sozinho no teste.
      PRIMEVEST_SCHEDULING_ENABLED: "false"
      # Mas o worker da fila de integrações liga: ele só processa a sincronização que o usuário pediu
      # (docs/planos/PLANO_INTEGRACAO_B3.md, F5).
      PRIMEVEST_INTEGRATIONS_WORKER_ENABLED: "true"
    volumes:
      - ./carga/data-teste/logos:/app/data/logos:ro

  adm-api:
    container_name: primevest-teste-adm-api
    environment:
      # Desliga fechamento, proventos, balancos, logos, conferencia e a recuperacao do fechamento na subida.
      # A carga inicial (POST /api/v1/admin/bootstrap) nao depende delas.
      PRIMEVEST_SCHEDULING_ENABLED: "false"
    volumes:
      - ./carga/data-teste:/app/data

  web:
    container_name: primevest-teste-web

  b3-investidor-mock:
    container_name: primevest-teste-b3-investidor-mock

  data:
    volumes:
      - ./carga/data-teste:/data
