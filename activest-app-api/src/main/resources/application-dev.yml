spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_activest
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

  # Dev: disable Redis if not available
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: simple

logging:
  level:
    com.activest: DEBUG
    org.springframework.security: DEBUG
