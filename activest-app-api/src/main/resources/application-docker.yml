# Perfil usado pelos containers (docker compose).
# Diferença central em relação ao perfil dev: aqui o Flyway está LIGADO e o banco
# nasce vazio, aplicando V1 até a última migration. É o que garante que o projeto
# sobe do zero em qualquer máquina.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:db_activest}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      # Todas as colunas mapeadas pelas 12 entidades foram conferidas contra o
      # schema final das migrations: nenhuma falta. As duas colunas created_at
      # acrescentadas em portfolio_assets e strategies não são mapeadas por
      # entidade nenhuma — o validador ignora coluna extra no banco.
      # Se a subida falhar aqui, a mensagem nomeia a tabela e a coluna exatas;
      # voltar para 'none' é uma linha.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

# Logos: volume ./data/logos da raiz do projeto (docker-compose.yml), so leitura.
activest:
  logos:
    dir: /app/data/logos

logging:
  level:
    com.activest: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
