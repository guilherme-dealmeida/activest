spring:
  application:
    name: primevest-app-api

  profiles:
    active: dev

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  #
  # 'baseline-version: 18' foi removido daqui. Ele fazia o Flyway marcar um banco
  # vazio como se já estivesse na versão 18, pulando a criação das tabelas (V1-V11)
  # e todos os seeds (V12-V18) — só a V19 rodava. Na prática o projeto não subia do
  # zero, dependia de um banco criado à mão antes disso.
  # Cada perfil decide se o Flyway roda: dev deixa desligado (banco local já pronto),
  # docker liga (banco nasce vazio e é construído pela cadeia completa).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Redis Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000

  # Mensagens em portugues (Bean Validation inclusive) qualquer que seja o Accept-Language: ate
  # 05/10/2026 a validacao saia em ingles ("size must be between 8 and 2147483647").
  web:
    locale: pt_BR
    locale-resolver: fixed

  # Foto de perfil (PUT /users/me/avatar): 2 MB por arquivo, como a regra do UserAvatarService.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # E-mail dos codigos de verificacao (docs/planos/PLANO_CADASTRO_USUARIO.md, 3.4). Sem configuracao,
  # o Mailpit do compose (SMTP 1025, tela em http://localhost:8025), que nao envia nada para fora.
  # SMTP real: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# Login pelo Google
#
# Só o client id, e ele não é segredo: vai no bundle do front, visível a quem
# abrir o DevTools. O que protege a aplicação é o Google só emitir ID token com
# esta audience para as origens autorizadas no console, e o backend conferir
# assinatura e audience (ver GoogleTokenVerifier).
#
# Client SECRET não aparece em lugar nenhum: o fluxo de ID token não usa.
# Vazio ou 'dummy' desliga o login pelo Google e some com o botão na tela.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Cadastro e codigos de verificacao (docs/planos/PLANO_CADASTRO_USUARIO.md, 3.2 e D16)
primevest.auth:
  # D16: false = ninguem cria conta (nem pelo Google). No DEV local o .env liga.
  signup-enabled: ${SIGNUP_ENABLED:false}
  # Onde ficam codigos, cadastros pendentes e contadores: redis (padrao) ou memory (testes).
  store: redis
  # HMAC dos codigos e do CPF. Vazio: cai no JWT_SECRET, com aviso no log.
  hash-key: ${PRIMEVEST_HASH_KEY:}
  code-ttl-minutes: 10
  max-attempts: 5
  resend-seconds: 60
  max-sends-per-hour: 5
  mail-from: ${MAIL_FROM:PrimeVest <nao-responda@primevest.local>}
  # Endereco do front, citado no rodape dos e-mails.
  app-url: ${APP_URL:http://localhost:5173}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:primevest-default-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000       # 24 hours
  refresh-expiration: 604800000  # 7 days

# Server
server:
  port: 8080
  servlet:
    context-path: /

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Fontes do catalogo (BRAPI, CoinGecko, B3, FNET, CVM) e as rotinas delas estao na adm-api
# (primevest-adm-api/src/main/resources/application.yml, docs/planos/PLANO_ADM_API.md).

# Binance (docs/planos/PLANO_CRIPTO_BINANCE.md, F3). So leitura, com a chave de cada
# usuario (integration_credentials) — nenhuma credencial aqui.
binance:
  base-url: https://api.binance.com
  timeout-seconds: 30
  # Primeira busca: desde quando. O Convert tem janelas de 30 dias e peso alto
  # (uma janela por ~1 s), por isso comeca mais tarde.
  history-start: "2017-07-01"
  convert-history-start: "2020-01-01"
  convert-pause-millis: 1100
  # Pares consultados no myTrades: moedas candidatas x moedas de cotacao.
  quote-assets: BRL,USDT,USDC,FDUSD,BTC,ETH,BNB
  probe-assets: BTC,ETH,BNB,SOL,XRP,USDT,USDC,ADA,DOGE
  # Peso por IP no minuto (limite da Binance: 6000). Passando daqui, a proxima
  # chamada espera o minuto virar — o orcamento e compartilhado por todos os usuarios.
  weight-threshold: 4800

# Area do Investidor da B3 (docs/planos/PLANO_INTEGRACAO_B3.md, 6.13). Credenciais do PrimeVest
# (Pacote de Acesso) e certificado vem do .env; o CPF de cada investidor fica cifrado em
# integration_credentials. Sem B3I_ENABLED=true a B3 nao aparece entre as fontes.
# Sem contrato com a B3, aponta para o simulador (servico b3-investidor-mock).
b3i:
  enabled: ${B3I_ENABLED:false}
  base-url: ${B3I_BASE_URL:}
  token-url: ${B3I_TOKEN_URL:}
  client-id: ${B3I_CLIENT_ID:}
  client-secret: ${B3I_CLIENT_SECRET:}
  scope: ${B3I_SCOPE:}
  cert-p12-path: ${B3I_CERT_P12_PATH:}
  cert-p12-password: ${B3I_CERT_P12_PASSWORD:}
  optin-url: ${B3I_OPTIN_URL:}
  timeout-seconds: 30
  # A5: historico da B3 desde 01/11/2019; a primeira busca pede desde aqui.
  history-start: "2019-11-01"
  # A6: uma consulta por CPF por dia; D-1 publicado a partir das 8h de Brasilia.
  once-per-day: ${B3I_ONCE_PER_DAY:true}
  available-after: "08:00"
  # A7: o token vale 1 h; renova 5 min antes.
  token-renew-seconds: 300
  # 6.3: Negociacao v2, Eventos v2 e Autorizacao sao inferidas — confirmar o contrato muda aqui.
  # Rota de conferencia (position, provisioned-events) em branco = nao consultada.
  paths:
    authorization: /api/authorization/v1/investors/{documentNumber}
    asset-trading: /api/asset-trading/v2/investors/{documentNumber}
    movement: /api/movement/v2/{product}/investors/{documentNumber}
    position: /api/position/v3/{product}/investors/{documentNumber}
    provisioned-events: /api/provisioned-events/v2/investors/{documentNumber}

# Rotinas (fuso America/Sao_Paulo). Cron do Spring: segundo minuto hora dia mes dia-da-semana.
primevest:
  # Tarefas (docs/planos/PLANO_TAREFAS.md): os tipos de tarefa deste servico (task_types.service)
  tasks:
    service: APP_API
  # Proventos sob demanda: a transacao pede o historico do ativo a adm-api (Redis). Interruptor tecnico (os testes
  # desligam); quem desliga de verdade e o tipo DIVIDENDS_SYNC na tela de Tarefas (docs/planos/PLANO_TAREFAS.md, D30).
  dividends:
    enabled: true
  # Horarios das rotinas da carteira: no banco (tabela tasks, docs/planos/PLANO_TAREFAS.md, D10).
  # Integracoes com corretoras (docs/planos/PLANO_CRIPTO_BINANCE.md, 6.3). A credencial de
  # cada usuario e cifrada com AES-256-GCM por esta chave-mestra, que fica fora
  # do banco (vem do .env). Vazia: a API sobe, mas conexoes ficam indisponiveis.
  # Rotacao: gere uma chave nova, mova a atual para previous-keys ("1:<base64>")
  # e incremente key-version. Ver CredentialCipher.
  integrations:
    credentials:
      key: ${PRIMEVEST_CREDENTIALS_KEY:}
      key-version: ${PRIMEVEST_CREDENTIALS_KEY_VERSION:1}
      previous-keys: ${PRIMEVEST_CREDENTIALS_PREVIOUS_KEYS:}
    # Sincronizacao em segundo plano (F5). O worker pega uma execucao da fila a
    # cada worker-delay-ms; a tarefa INTEGRATIONS_DAILY_SYNC (08:45, no banco) enfileira as conexoes ativas.
    worker-delay-ms: 5000
    # Execucao RUNNING ha mais tempo que isto e tida como perdida (API caiu no meio).
    stale-minutes: 30
    # Rotina diaria confirma sozinha quando nao ha nada a decidir (nenhuma
    # possivel duplicata) e a conexao ja teve uma importacao confirmada pelo usuario.
    auto-confirm-scheduled: true
  # Listagem de emissoras (docs/planos/PLANO_LISTAGEM_EMISSORAS.md, F4): quando o preco, o balanco (acao) ou o
  # informe (FII) recebem a marca de "dado antigo".
  issuer-page:
    stale-data:
      price-days: 7
      statement-months: 6
      report-months: 3
  logos:
    # Pasta fora do banco (B18), so leitura aqui; quem baixa e a adm-api. No Docker: ./data/logos.
    dir: ${LOGOS_DIR:../carga/data/logos}

# Logging
logging:
  level:
    com.primevest: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
